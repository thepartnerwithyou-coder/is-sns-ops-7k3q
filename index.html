<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>부동산이즈 SNS 운영실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: 맞집 SNS 운영실과 같은 틀. 왼쪽 흰 사이드바(채널별 색 띠 + 메뉴), 오른쪽 옅은 파랑 바탕에 결론 제목 → 큰 숫자 → 근거 차트 순서.
   색은 의미를 가진다: 채널색(블로그 초록·유튜브 빨강·인스타 분홍·스레드 검정), 상태색(좋음·주의·위험)은 판정에만 쓴다. */
:root{
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bg:#eef2fb; --bg2:#f8f9fd;
  --surface:#ffffff; --surface2:#f3f5fb; --side:#ffffff; --input:#ffffff;
  --fg:#101828; --menu:#4b5262; --muted:#6f7891; --soft:#b3bac8; --line:#e6eaf3;
  --accent:#2f6bf0; --accent-soft:#e5edff; --accent-fg:#ffffff;
  --blog:#03a14a; --blog-soft:#e3f5ea; --blog-deep:#027a38;
  --yt:#e62117; --ig:#dc2743; --th:#14171f;
  --good:#15803d; --good-soft:#e3f4ea; --warn:#b45309; --warn-soft:#fdf0d9; --crit:#dc2626; --crit-soft:#fde6e4;
  --shadow:0 1px 2px rgba(20,32,70,.04),0 4px 14px rgba(40,70,150,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f19; --bg2:#0f1320;
    --surface:#151b2a; --surface2:#1b2335; --side:#10151f; --input:#151b2a;
    --fg:#e8ecf5; --menu:#c5ccdb; --muted:#97a1b6; --soft:#59627a; --line:#252e46;
    --accent:#6a96ff; --accent-soft:#1c2a4f; --accent-fg:#0b1226;
    --blog:#2fd478; --blog-soft:#12301f; --blog-deep:#2fd478;
    --yt:#ff5a50; --ig:#ff6b86; --th:#e8ecf5;
    --good:#4ade80; --good-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2b0f; --crit:#f87171; --crit-soft:#3d1715;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f19; --bg2:#0f1320;
  --surface:#151b2a; --surface2:#1b2335; --side:#10151f; --input:#151b2a;
  --fg:#e8ecf5; --menu:#c5ccdb; --muted:#97a1b6; --soft:#59627a; --line:#252e46;
  --accent:#6a96ff; --accent-soft:#1c2a4f; --accent-fg:#0b1226;
  --blog:#2fd478; --blog-soft:#12301f; --blog-deep:#2fd478;
  --yt:#ff5a50; --ig:#ff6b86; --th:#e8ecf5;
  --good:#4ade80; --good-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2b0f; --crit:#f87171; --crit-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{word-break:keep-all;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:100%;background:linear-gradient(150deg,var(--bg) 0%,var(--bg2) 60%)}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:0 12px 28px;display:flex;flex-direction:column}
.sidehead{display:flex;align-items:center;height:49px;border-bottom:1px solid var(--line);margin:0 -12px 18px;padding:0 14px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.02em}
.sect+.sect{margin-top:18px}
.phead{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:13px;color:#fff;font-weight:800;font-size:15px;margin-bottom:8px}
.phead .ic{font-size:20px}
.phead.rp{background:linear-gradient(180deg,#3b4a6b,#1d2740);box-shadow:0 9px 16px -7px rgba(29,39,64,.55)}
.phead.bl{background:linear-gradient(180deg,#2fd478,#07a950);box-shadow:0 9px 16px -7px rgba(7,169,80,.6)}
.phead.yt{background:linear-gradient(180deg,#f04a40,#d6261c);box-shadow:0 9px 16px -7px rgba(214,38,28,.6)}
.phead.ig{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);box-shadow:0 9px 16px -7px rgba(220,39,67,.55)}
.phead.th{background:linear-gradient(180deg,#3a3f4c,#14171f);box-shadow:0 9px 16px -7px rgba(20,23,31,.6)}
.phead .soon{margin-left:auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.22)}
.item{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 12px;border-radius:11px;font-weight:700;font-size:15px;letter-spacing:-.02em;text-align:left;color:var(--menu)}
.item .ic{font-size:19px}
.item:hover{background:var(--surface2)}
.item[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.topbar{display:none}
.scrim{display:none}

.main{min-width:0;padding-block:38px 64px;padding-left:max(16px,env(safe-area-inset-left,0px),clamp(16px,2.4vw,44px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,2.6vw,36px))}
.inner{max-width:1180px}
.eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:16px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.tag{padding:3px 11px;border-radius:7px;font-weight:800;font-size:11.5px;letter-spacing:.04em;color:#fff}
.tag.t-rp{background:#1d2740}.tag.t-bl{background:#03a94d}.tag.t-yt{background:#e62117}.tag.t-th{background:#14171f}
.tag.t-ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.eyebrow .sep{width:4px;height:4px;border-radius:50%;background:var(--soft)}
h1{margin:0;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.big{display:flex;align-items:baseline;gap:10px;margin:6px 0 26px;flex-wrap:wrap}
.big b{font-size:40px;line-height:1.1;font-weight:800;color:var(--blog-deep);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:13px;font-weight:600}
.ptool{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 22px;padding:12px 0;border-bottom:1px solid var(--line)}
.note{color:var(--muted);font-size:13px;font-weight:600}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--blog-deep);box-shadow:var(--shadow)}
.note b{color:var(--fg)}

/* 히어로 */
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
.hv{padding:26px 28px 20px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0bb85a 0%,#037a3a 100%);box-shadow:0 18px 34px -18px rgba(3,122,58,.7);display:flex;flex-direction:column;min-width:0}
.hl{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;flex-wrap:wrap}
.hl small{font-size:13px;font-weight:600;opacity:.8}
.hl .chipw{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:13px;font-weight:800}
.hn{margin:6px 0 4px;font-size:60px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hn small{font-size:20px;font-weight:700;margin-left:4px;opacity:.85}
.hcap{font-size:14px;font-weight:600;opacity:.85;margin-bottom:16px}
.hbars{display:flex;align-items:flex-end;gap:4px;height:92px;margin-top:auto}
.hbars i{flex:1;min-width:2px;max-width:48px;background:rgba(255,255,255,.5);border-radius:4px 4px 0 0;position:relative}
.hbars i.cur{background:#fff}
.hbars i.part{background:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 3px,rgba(255,255,255,.35) 3px 6px)}
.hax{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;font-weight:600;opacity:.8}
.hs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0}
.hr{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 22px}
.hr+.hr{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:4px;background:var(--blog)}
.dot.b{background:var(--accent)}.dot.c{background:var(--warn)}
.rl{font-size:13.5px;font-weight:700;color:var(--muted)}
.rv{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2}
.rv small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.rd{max-width:140px;text-align:right;font-size:12.5px;line-height:1.4;color:var(--muted);font-weight:600}

/* 구간 */
.blk{margin-top:48px}
.blk.first{margin-top:8px}
.sec h2{position:relative;margin:0;padding-left:16px;font-size:21px;line-height:1.35;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.sec h2::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:5px;border-radius:99px;background:var(--blog)}
.sec h2.c-a::before{background:var(--accent)}
.sec h2.c-w::before{background:var(--warn)}
.sec h2.c-k::before{background:var(--fg)}
.sec .sub{margin:6px 0 18px 16px;color:var(--muted);font-size:14.5px;line-height:1.6;font-weight:500;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 26px}
.ptitle{font-size:15px;font-weight:800;margin-bottom:14px}
.hint{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.7;font-weight:500}
.hint b{color:var(--fg)}

/* 세로 막대 */
.vb{display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
.vbc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;cursor:default}
.vbc i{display:block;width:100%;max-width:28px;background:var(--blog);border-radius:4px 4px 0 0}
.vbc.z i{background:var(--crit);height:3px!important;border-radius:2px;opacity:.55}
.vbc.dim i{background:color-mix(in srgb,var(--blog) 45%,var(--surface2))}
.vbc:hover i{filter:brightness(1.1)}
.vbv{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
.vbx{display:flex;gap:2px;margin-top:6px}
.vbx span{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:visible}

/* 가로 막대 비교 */
.ir{display:grid;grid-template-columns:190px minmax(0,1fr) 64px 160px;gap:16px;align-items:center;padding:13px 0}
.ir+.ir{border-top:1px solid var(--line)}
.in{font-size:14.5px;font-weight:700}
.trk{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--blog)}
.trk.dim i{background:color-mix(in srgb,var(--blog) 40%,var(--surface2))}
.iv{text-align:right;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ip{text-align:right;color:var(--muted);font-size:13px;font-weight:600}

/* 표 */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
th button{font-weight:700;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
th button[aria-pressed="true"]{color:var(--accent)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums;font-size:14px}
tr:last-child td{border-bottom:0}
td.t{min-width:280px}
td.t a{font-weight:700;text-decoration:none;line-height:1.45}
td.t a:hover{text-decoration:underline}
td.t .sub2{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;font-weight:600}
td.n,th.n{text-align:right}
td.m{color:var(--muted);white-space:nowrap}
.na{color:var(--soft);font-weight:600}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap}
.rk.top{background:var(--good-soft);color:var(--good)}
.rk.mid{background:var(--warn-soft);color:var(--warn)}
.rk.out{background:var(--surface2);color:var(--muted);font-weight:700}
.mv{font-size:12px;font-weight:800;margin-left:6px}
.mv.up{color:var(--good)}.mv.down{color:var(--crit)}

/* 판정 카드 */
.verd{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--soft)}
.vc.good{border-top-color:var(--good)}.vc.warn{border-top-color:var(--warn)}.vc.crit{border-top-color:var(--crit)}
.vc h3{margin:0;font-size:16.5px;line-height:1.45;font-weight:800;letter-spacing:-.02em}
.vc .fact{padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13.5px;line-height:1.6;font-weight:700}
.vc p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.off{background:var(--surface2);color:var(--muted)}

.verdict-hero{padding:26px 28px;border-radius:20px;background:linear-gradient(135deg,#1d2740 0%,#0f1526 100%);color:#fff;box-shadow:0 18px 34px -20px rgba(15,21,38,.8)}
.verdict-hero .vh1{font-size:13px;font-weight:700;opacity:.75;margin-bottom:8px}
.verdict-hero .vh2{font-size:23px;line-height:1.45;font-weight:800;letter-spacing:-.025em;text-wrap:balance;max-width:40ch}
.verdict-hero p{margin:14px 0 0;font-size:15px;line-height:1.75;font-weight:500;opacity:.88;max-width:70ch}
.vcount{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.vcount span{padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700}

/* 개선안 */
.acts{display:flex;flex-direction:column;gap:12px}
.act{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.act .no{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:15px}
.act h3{margin:2px 0 6px;font-size:16.5px;line-height:1.45;font-weight:800;letter-spacing:-.02em}
.act p{margin:0;color:var(--fg);font-size:14.5px;line-height:1.75;font-weight:500;max-width:76ch}
.act .ex{margin-top:8px;color:var(--muted);font-size:13px;font-weight:700}
.act .ex b{color:var(--good)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.chk{display:flex;flex-direction:column;gap:2px}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-radius:10px;font-size:14.5px;line-height:1.5;font-weight:600;cursor:pointer}
.chk label:hover{background:var(--surface2)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--blog);flex:none}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.tpc{display:flex;flex-direction:column;gap:10px}
.tp{padding:16px 18px;border-radius:14px;background:var(--surface2)}
.tp b{display:block;font-size:15px;line-height:1.45;font-weight:800}
.tp .kw{display:inline-block;margin:6px 0 4px;padding:2px 9px;border-radius:7px;background:var(--blog-soft);color:var(--blog-deep);font-size:12px;font-weight:800}
.tp span{display:block;color:var(--muted);font-size:13.5px;line-height:1.6;font-weight:500}
.bm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:10px;background:var(--surface2);color:var(--fg);font-weight:800;font-size:13px;white-space:nowrap;border:1px solid var(--line)}
.bm-btn:hover{border-color:var(--accent)}
.bm-btn.pri{background:var(--blog);border-color:var(--blog);color:#fff}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.65;font-weight:500}
.steps b{font-weight:800}

/* 채널 카드 (주간) */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch .chh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch .chn{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.ch .sq{width:12px;height:12px;border-radius:4px}
.ch .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch .kv div{padding:10px 12px;border-radius:11px;background:var(--surface2)}
.ch .kv span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.ch .kv b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ch .off{color:var(--muted);font-size:13.5px;line-height:1.6;font-weight:500}

.plempty{padding:56px 12px;text-align:center;color:var(--muted)}
.plempty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}
.plempty span{display:block;font-size:14px;font-weight:600;line-height:1.6}
.spin{display:block;width:26px;height:26px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blog);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tip{position:fixed;z-index:80;pointer-events:none;padding:8px 11px;border-radius:9px;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:700;line-height:1.45;max-width:260px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}

/* 냉정한 성과 진단 — 맞집 SNS 운영실과 같은 구성. 등급색: A 초록 · B 파랑 · C 주황 · D 빨강 */
.sec h2.c-crit::before{background:var(--crit)}
.rvtop{display:flex;gap:22px;align-items:flex-start}

<script>
window.claude={use:function(){
  return fetch('data.json?t='+Date.now()).then(function(r){return r.json()}).then(function(all){
    function snap(col){
      var m=all[col]||{};
      return {docs:Object.keys(m).map(function(id){return {id:id,data:function(){return m[id]}}})};
    }
    return {collection:function(col){
      return {onSnapshot:function(ok){setTimeout(function(){ok(snap(col))},0)}};
    }};
  });
}};

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var ic=function(n){return '<svg class="ic"><use href="#i-'+n+'"/></svg>'};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var n=function(x){return Math.round(+x||0).toLocaleString('ko-KR')};
  var med=function(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y}),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
  var r1=function(x){return Math.round(x*10)/10};
  var DAYS='일월화수목금토';
  var md=function(d){return (+d.slice(5,7))+'/'+(+d.slice(8,10))};

  /* ---------- 저장소 ---------- */
  var COLS=['sns','analysis','review','bench','plan'];
  var DB={sns:{},analysis:{},review:{},bench:{},plan:{}}, LOADED={}, NODB=false;
  var UI={view:'bl-perf',sort:'d',range:7,plan:{},tab:{}};
  try{var rg=+localStorage.getItem('isz-range');if(rg===7||rg===30||rg===90)UI.range=rg}catch(e){}
  try{var h=location.hash.slice(1);if(h)UI.view=h}catch(e){}
  try{var sv=localStorage.getItem('isz-view');if(!location.hash&&sv)UI.view=sv}catch(e){}

  function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r('__timeout')},ms)})])}
  function start(){
    if(!window.claude||!window.claude.use){NODB=true;render();return}
    window.claude.use('db').then(function(db){
      if(!db){NODB=true;render();return}
      COLS.forEach(function(col){
        db.collection(col).onSnapshot(function(snap){
          var o={};snap.docs.forEach(function(d){o[d.id]=d.data()});DB[col]=o;LOADED[col]=true;render(true);
        },function(){LOADED[col]=true;render(true)});
      });
    },function(){NODB=true;render()});
  }
  setTimeout(function(){if(!Object.keys(LOADED).length&&!NODB){NODB='late';render()}},16000);

  /* ---------- 공통 조각 ---------- */
  var TAG={rp:'REPORT',bl:'BLOG',yt:'YOUTUBE',ig:'INSTAGRAM',th:'THREADS'};
  function head(k,sub,title,big,label){
    return '<div class="eyebrow"><span class="tag t-'+k+'">'+TAG[k]+'</span><span class="sep"></span><span>'+sub+'</span></div>'
      +'<h1'+(big==null?' style="margin-bottom:24px"':'')+'>'+title+'</h1>'
      +(big!=null?'<div class="big"><b>'+big+'</b><span>'+label+'</span></div>':'');
  }
  function sec(cls,title,sub){return '<div class="sec"><h2 class="'+cls+'">'+title+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>'}
  function empty(title,sub,spin){return '<div class="panel"><div class="plempty">'+(spin?'<span class="spin"></span>':'')+'<b>'+title+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div></div>'}
  function waiting(k,title){
    if(NODB===true) return head(k,'저장소 연결 안 됨',title)+empty('숫자를 불러올 수 없어요','claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.');
    if(NODB==='late') return head(k,'불러오기 지연',title)+empty('숫자를 아직 못 받았어요','새로고침해도 그대로면 이 화면을 캡처해서 Claude에게 보내 주세요.');
    return head(k,'불러오는 중',title)+empty('저장소에서 숫자를 불러오는 중이에요','',true);
  }
  function postUrl(B,id){return 'https://blog.naver.com/'+encodeURIComponent(B.blog)+'/'+encodeURIComponent(id)}
  function rk(v,suffix){
    if(v===''||v==null) return '<span class="rk out">'+(suffix==='m'?'첫 화면 밖':'30위 밖')+'</span>';
    v=+v;return '<span class="rk '+(v<=3?'top':v<=10?'mid':'out')+'">'+v+'위</span>';
  }

  /* ---------- 냉정한 성과 진단 (review/bl — 3일마다 자동으로 새로 써서 넣는다) ---------- */
  function gradeCls(g){g=String(g||'').charAt(0);return g==='A'?'ga':g==='B'?'gb':g==='C'?'gc':g==='D'?'gd':'gh'}
  function reviewBlock(){

  function blogCalc(B,d){
    d=d||7;
    var P=(B.posts||[]).slice().sort(function(a,b){return a.d<b.d?1:-1});
    var V=(B.visitors||[]).slice().sort(function(a,b){return a.date<b.date?-1:1});
    var today=(B.updated||'').slice(0,10);
    var full=V.filter(function(v){return v.date<today});
    var cur=full.slice(-d), prev=full.slice(-2*d,-d);
    var avg=function(a){return a.length?a.reduce(function(s,v){return s+v.v},0)/a.length:0};
    var cut=isoAgo(today,d), cut2=isoAgo(today,2*d);
    var inP=P.filter(function(p){var x=p.d.slice(0,10);return x>cut&&x<=today});
    var inPrev=P.filter(function(p){var x=p.d.slice(0,10);return x>cut2&&x<=cut});
    var dates=(B.ranks||[]).map(function(r){return r.date}).filter(function(x,i,a){return a.indexOf(x)===i}).sort();
    var rd=dates[dates.length-1];
    // 비교 기준: 기간 시작일 이전의 가장 최근 기록. 없으면 비교하지 않는다.
    var base=dates.filter(function(x){return x<=cut}).pop()||null;
    var R=(B.ranks||[]).filter(function(r){return r.date===rd});
    var Rbase={};if(base)(B.ranks||[]).filter(function(r){return r.date===base}).forEach(function(r){Rbase[r.kw]=r});
    return {P:P,V:V,today:today,d:d,cur:cur,prev:prev,avgCur:avg(cur),avgPrev:avg(prev),
      bars:V.filter(function(v){return v.date>cut}),inP:inP,inPrev:inPrev,
      R:R,Rbase:Rbase,rankBase:base,rankDate:rd,byId:P.reduce(function(o,p){o[p.id]=p;return o},{})};
  }
  function monthsBack(k,endYm){var y=+endYm.slice(0,4),m=+endYm.slice(5,7),out=[];for(var i=k-1;i>=0;i--){var mm=m-i,yy=y;while(mm<1){mm+=12;yy--}out.push(yy+'-'+(mm<10?'0':'')+mm)}return out}

    var v=(a-b)/b*100;return '<span class="mv '+(v>=0?'up':'down')+'" style="margin:0">'+(v>=0?'▲':'▼')+Math.abs(v).toFixed(0)+'%</span>';
  }

      +'<div class="panel">'+tr.map(function(x){var mx=Math.max(x.all,x.top,1);
        return '<div class="ir t1"><div class="in">'+esc(x.name)+'</div><div><div class="trk" style="height:8px;margin-bottom:4px"><i style="width:'+Math.round(x.top/Math.max(60,mx)*100)+'%"></i></div><div class="trk dim" style="height:8px"><i style="width:'+Math.round(x.all/Math.max(60,mx)*100)+'%"></i></div></div><div class="iv">'+x.top+'%</div><div class="ip">전체 '+x.all+'% · '+(x.diff>=0?'+':'')+x.diff+'%p</div></div>'}).join('')
      +'<p class="hint">진한 막대 = 상위 글, 흐린 막대 = 전체 글에서 그 특징이 있는 비율이에요.</p></div></section>';
    h+='<section class="blk">'+sec('c-k','홈에서 반응이 큰 글 '+(T.top||[]).length+'개','공감과 댓글 합산 순이에요. 제목을 누르면 글이 열려요. 조회수는 공개되지 않아요.')
      +'<div class="tablewrap"><table><thead><tr><th>제목</th><th>올린 날</th><th class="n">공감</th><th class="n">댓글</th></tr></thead><tbody>'
      +(T.top||[]).map(function(p){return '<tr><td class="t"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a><span class="sub2">'+esc(p.nick||'')+'</span></td><td class="m">'+esc((p.date||'').slice(5,10).replace('-','/'))+'</td><td class="n">'+n(p.likes)+'</td><td class="n">'+n(p.comments)+'</td></tr>'}).join('')+'</tbody></table></div></section>';
    if(G.length) h+='<section class="blk">'+sec('c-w','구글에서 지금 뜨는 검색어 '+G.length+'개','구글 트렌드 한국 일간 인기 검색어예요. 오른쪽은 네이버에서 그 검색어에 AI 브리핑이 나오는지예요(위쪽 5개만 확인).')
      +'<div class="panel">'+G.map(function(g){var a=g.ai;
        return '<div class="ir t2"><div><div class="in">'+esc(g.kw)+'</div>'+((g.news||[])[0]?'<div class="ip" style="text-align:left;margin-top:2px">'+esc(g.news[0])+'</div>':'')+'</div><div class="iv" style="font-size:15px">'+esc(g.traffic||'')+'</div><div>'+(a?(a.present?'<span class="pill good">AI 브리핑 있음 · 출처 '+(a.sources||[]).length+'곳</span>':'<span class="pill off">AI 브리핑 없음</span>'):'<span class="na">확인 안 함</span>')+'</div></div>'}).join('')+'</div></section>';
    if((I.caution||[]).length) h+='<section class="blk"><div class="panel"><div class="ptitle">쓰기 전에 알아둘 것</div><ul class="steps">'+I.caution.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div></section>';
    return h;
  }


  /* =========================================================
     움직이는 그래프 (2026-10-30): 방문자 선 그래프 · 순위 변화 슬로프
     애니메이션은 처음 그려질 때와 기간을 바꿀 때만 재생하고, 모션 줄이기 설정이면 끝 모양으로 바로 보여줘요.
     ========================================================= */
  function trendBlock(C,d){
    var all=C.bars.slice();
    if(all.length<3) return '';
    var full=all.filter(function(v){return v.date!==C.today});
    if(full.length<2) return '';
    var part=all.filter(function(v){return v.date===C.today})[0];
    var mx=Math.max.apply(null,all.map(function(v){return v.v}).concat([1]));
    var top=Math.max(10,Math.ceil(mx*1.15/10)*10), N=all.length;
    var X=function(i){return N>1?i/(N-1)*100:50}, Y=function(v){return 100-(v/top*90)-4};
    var pts=all.map(function(v,i){return {x:X(i),y:Y(v.v),v:v}});
    var fp=pts.filter(function(p){return p.v.date!==C.today});
    var f=function(p){return p.x.toFixed(2)+' '+p.y.toFixed(2)};
    var line='M'+fp.map(f).join(' L'), area=line+' L'+fp[fp.length-1].x.toFixed(2)+' 100 L'+fp[0].x.toFixed(2)+' 100 Z';
    var dash=(part&&fp.length)?'M'+f(fp[fp.length-1])+' L'+f(pts[pts.length-1]):'';
    var first=full[0], last=full[full.length-1], diff=last.v-first.v;
    var best=full.reduce(function(a,b){return b.v>a.v?b:a});
    var title='하루 방문자가 '+md(first.date)+' '+n(first.v)+'명에서 '+md(last.date)+' '+n(last.v)+'명으로 '+(diff>0?'늘었어요':diff<0?'줄었어요':'그대로예요');
    var h='<section class="blk">'+sec('c-a',title,'가장 많았던 날은 '+md(best.date)+'('+DAYS[new Date(best.date).getDay()]+') '+n(best.v)+'명이에요. 점에 마우스를 올리면 그날 숫자가 보여요. 점선은 아직 집계 중인 오늘이에요.')
      +'<div class="panel"><div class="lc"><span class="lcy" style="top:0">'+n(top)+'</span><span class="lcy" style="top:50%">'+n(top/2)+'</span><span class="lcy" style="bottom:0">0</span>'
      +'<svg class="lcs" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="일별 방문자 선 그래프"><path class="lca" d="'+area+'"/><path class="lcl" vector-effect="non-scaling-stroke" d="'+line+'"/>'
      +(dash?'<path class="lcd" vector-effect="non-scaling-stroke" d="'+dash+'"/>':'')+'</svg>';
    pts.forEach(function(p,i){
      var isPart=p.v.date===C.today, isLast=p===fp[fp.length-1];
      h+='<i class="lcp'+(isPart?' part':'')+(isLast?' end':'')+'" style="left:'+p.x.toFixed(2)+'%;top:'+p.y.toFixed(2)+'%;--i:'+i+'" data-tip="'+md(p.v.date)+'('+DAYS[new Date(p.v.date).getDay()]+') 방문자 '+n(p.v.v)+'명'+(isPart?' · 집계 중':'')+'"></i>';
    });
    h+='</div><div class="lcx"><span>'+md(all[0].date)+'</span><span>'+md(all[all.length-1].date)+'</span></div></div></section>';
    return h;
  }

  function slopeBlock(C,d){
    var rows=C.R.filter(function(r,i,arr){return C.Rbase[r.kw]&&arr.findIndex(function(x){return x.kw===r.kw})===i}).map(function(r){
      var p=C.Rbase[r.kw];return {kw:r.kw,a:p.mr===''?null:+p.mr,b:r.mr===''?null:+r.mr}});
    if(!C.rankBase||!rows.length) return '<section class="blk">'+sec('c-w','순위 변화 그래프는 기록이 더 쌓이면 나와요','통합검색 순위를 '+d+'일 전과 비교해서 그려요. 비교할 옛 기록이 아직 없어요.')+'</section>';
    var nums=[];rows.forEach(function(r){if(r.a!=null)nums.push(r.a);if(r.b!=null)nums.push(r.b)});
    var maxR=Math.max.apply(null,nums.concat([5])), OUT=maxR+2;
    var P=function(v){var y=v==null?OUT:v;return 6+(y-1)/(OUT-1)*88};
    var cls=function(r){var a=r.a==null?OUT:r.a,b=r.b==null?OUT:r.b;return b<a?'up':b>a?'down':'same'};
    var up=rows.filter(function(r){return cls(r)==='up'}), dn=rows.filter(function(r){return cls(r)==='down'}), sm=rows.filter(function(r){return cls(r)==='same'});
    var txt=function(v){return v==null?'첫 화면 밖':v+'위'};
    var ticks=[1,5,10,15,20,25].filter(function(t){return t<=maxR});
    var h='<section class="blk">'+sec('c-k','통합검색 순위가 오른 키워드 '+up.length+'개, 내린 키워드 '+dn.length+'개예요',md(C.rankBase)+'과 '+md(C.rankDate)+'을 비교했어요. 위로 갈수록 순위가 높아요. 초록 선은 올랐고 빨간 선은 내렸고 회색 선은 그대로예요. 점에 마우스를 올리면 키워드가 보여요.')
      +'<div class="panel"><div class="slh"><span>'+md(C.rankBase)+'</span><span>'+md(C.rankDate)+'</span></div><div class="sl"><div class="sla">';
    ticks.forEach(function(t){h+='<span style="top:'+P(t)+'%">'+t+'위</span>'});
    h+='<span style="top:'+P(null)+'%">밖</span></div><div class="slm"><svg class="sls" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">';
    ticks.concat([null]).forEach(function(t){h+='<line class="slg" x1="0" x2="100" y1="'+P(t)+'" y2="'+P(t)+'" vector-effect="non-scaling-stroke"/>'});
    rows.forEach(function(r){h+='<line class="sll '+cls(r)+'" x1="0" x2="100" y1="'+P(r.a)+'" y2="'+P(r.b)+'" vector-effect="non-scaling-stroke"/>'});
    h+='</svg>';
    rows.forEach(function(r,i){var tip=esc(r.kw)+' · '+txt(r.a)+' → '+txt(r.b);
      h+='<i class="sld '+cls(r)+'" style="left:0;top:'+P(r.a)+'%;--i:'+i+'" data-tip="'+tip+'"></i><i class="sld '+cls(r)+'" style="left:100%;top:'+P(r.b)+'%;--i:'+i+'" data-tip="'+tip+'"></i>'});
    h+='</div><div class="sla r">';
    ticks.forEach(function(t){h+='<span style="top:'+P(t)+'%">'+t+'위</span>'});
    h+='<span style="top:'+P(null)+'%">밖</span></div></div>';
    var grp=function(name,list,c){return list.length?'<p class="hint" style="margin:10px 0 0"><span class="pill '+c+'">'+name+' '+list.length+'</span> '+list.map(function(r){return esc(r.kw)+'('+txt(r.a)+'→'+txt(r.b)+')'}).join(' · ')+'</p>':''};
    h+=grp('올랐어요',up,'good')+grp('내렸어요',dn,'crit')+grp('그대로예요',sm,'off');
    return h+'</div></section>';
  }

  /* ---------- 그리기 ---------- */
  function render(soft){
    var v=UI.view, k=v.split('-')[0], h;
    UI.playNow=false;
    if(v==='bl-perf')h=viewBlPerf();
    else if(v==='bl-admin')h=viewBlAdmin();
    else if(v==='bl-insight')h=viewBlInsight();
    else if(v==='bl-bench')h=viewBench();
    else if(v==='bl-top')h=viewTop();
    else if(v==='bl-trend')h=viewTrend();
    else if(/-plan$/.test(v)&&PLAN_NAME[k])h=viewPlan(k);
    else if(v==='rp-week')h=viewWeek();
    else if(PLAN[k])h=viewSoon(k);
    else {UI.view='bl-perf';return render()}
    var y=window.scrollY;
    $('#view').innerHTML=h;drawNav();
    $('#view').classList.toggle('play',!!UI.playNow);
    if(UI.playNow){clearTimeout(UI.at);var ak=UI.akey;UI.at=setTimeout(function(){UI.animDone=ak},1800)}
    if(soft)window.scrollTo(0,y);
  }
  function go(v){
    UI.view=v;try{localStorage.setItem('isz-view',v)}catch(e){}
    try{history.replaceState(null,'','#'+v)}catch(e){}
    render();window.scrollTo(0,0);closeMenu();
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-v]');if(b){go(b.getAttribute('data-v'));return}
    var g=e.target.closest('[data-range]');if(g){UI.range=+g.getAttribute('data-range');try{localStorage.setItem('isz-range',UI.range)}catch(_){}render(true);return}
    var s=e.target.closest('[data-sort]');if(s){UI.sort=s.getAttribute('data-sort');render(true);return}
    var pr=e.target.closest('[data-plan]');if(pr){var kk=UI.view.split('-')[0];UI.plan[kk]=+pr.getAttribute('data-plan');render(true);return}
    var pt=e.target.closest('[data-ptab]');if(pt){var k2=UI.view.split('-')[0];UI.tab[k2+(UI.plan[k2]||0)]=+pt.getAttribute('data-ptab');render(true);return}
    if(e.target.id==='plCopy'){var k3=e.target.getAttribute('data-k'),P3=DB.plan[k3];if(P3){var i3=UI.plan[k3]||0,t3=P3.topics[i3],v3=(t3.versions||[])[UI.tab[k3+i3]||0]||{};copyText((t3.titles||[])[t3.best_hook||0]+'\n\n'+(v3.lines||[]).join('\n'));e.target.textContent='복사했어요'}return}
    if(e.target.id==='chkReset'){CHK={};try{localStorage.removeItem('isz-chk')}catch(_){}render(true)}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches('#chk input')){CHK[t.getAttribute('data-i')]=t.checked;try{localStorage.setItem('isz-chk',JSON.stringify(CHK))}catch(_){}}
  });
  // 막대 위 말풍선
  var tip=$('#tip');
  document.addEventListener('pointerover',function(e){var el=e.target.closest('[data-tip]');if(!el){tip.hidden=true;return}tip.textContent=el.getAttribute('data-tip');tip.hidden=false});
  document.addEventListener('pointermove',function(e){if(tip.hidden)return;var x=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8),y=e.clientY-tip.offsetHeight-12;tip.style.left=x+'px';tip.style.top=(y<8?e.clientY+18:y)+'px'});
  document.addEventListener('pointerleave',function(){tip.hidden=true});
  // 휴대폰 메뉴
  function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('show')}
  $('#menuBtn').addEventListener('click',function(){$('#side').classList.add('open');$('#scrim').classList.add('show')});
  $('#scrim').addEventListener('click',closeMenu);

  render();start();
})();
</script>
